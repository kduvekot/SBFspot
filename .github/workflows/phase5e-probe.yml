            asset_sha: 1d5ee0f306072c87ed410585b3170979b8691f604341f01413af5efca3791a20
            prefix: 'd:\rpi\cross\bookworm\gcc12.2.0\arm-linux-gnueabihf\sysroot\usr\include'
            mirror: raspbian
            db_pkgs: ''
            curl_pkg: ''
            has_daemon: false
