            curl_pkg: ''
            has_daemon: false
            common_ldflags: '-s -Wl,--as-needed'
            sbfspot_extra: '-Wl,-Bstatic -lbluetooth -Wl,-Bdynamic'
            daemon_extra: ''
          - id: mariadb-arm-buster
            codename: buster
            debarch: armhf
            triplet: arm-linux-gnueabihf
            db: mariadb
            make_target: mariadb
            asset_name: sbfspot-mariadb-arm-linux-buster.tar.gz
            asset_sha: 9c9e47237101497e921d2da28b06106b110c44a0cb274f4efafd00e1d1fa0224
