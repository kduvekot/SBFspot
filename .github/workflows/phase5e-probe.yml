    env:
      TAG: V3.9.12
      UPSTREAM: SBFspot/SBFspot

    steps:
      - name: Install host-side tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            debootstrap xxd binutils file curl jq debian-archive-keyring

      - name: Fetch Raspbian keyring (if applicable)
        if: matrix.cell.mirror == 'raspbian' || matrix.cell.mirror == 'raspbian-legacy'
        run: |
          set -euxo pipefail
          mkdir -p keyring
          curl -sSL https://archive.raspbian.org/raspbian.public.key \
            -o keyring/raspbian.asc
          gpg --dearmor < keyring/raspbian.asc > keyring/raspbian.gpg

      - name: Debootstrap rootfs
        run: |
          set -euxo pipefail
          case "${{ matrix.cell.mirror }}" in
            raspbian)
              MIRROR="http://archive.raspbian.org/raspbian"
              KEYRING="$PWD/keyring/raspbian.gpg"
              ;;
            raspbian-legacy)
              MIRROR="http://legacy.raspbian.org/raspbian"
              KEYRING="$PWD/keyring/raspbian.gpg"
              ;;
            debian)
              MIRROR="http://snapshot.debian.org/archive/debian/20250222T000000Z"
              KEYRING="/usr/share/keyrings/debian-archive-keyring.gpg"
              ;;
          esac
          sudo debootstrap \
            --arch=${{ matrix.cell.debarch }} \
            --variant=minbase \
            --keyring="$KEYRING" \
            --include=ca-certificates \
            "${{ matrix.cell.codename }}" \
            rootfs "$MIRROR"

      - name: Check out upstream V3.9.12
        uses: actions/checkout@v6
        with:
          repository: ${{ env.UPSTREAM }}
          ref: ${{ env.TAG }}
          path: upstream

      - name: Derive SOURCE_DATE_EPOCH from release tag
        # The commit that V3.9.12 points at has a single immutable
        # timestamp. Use that as the reproducible-builds canonical
        # "build moment" — every downstream tool (tar, gzip, gcc,
        # objcopy, ar, strip) respects SOURCE_DATE_EPOCH when set in
        # the environment. Per-tag → per-tarball reproducibility.
        # Convention: reproducible-builds.org.
        run: |
          set -euxo pipefail
          SDE=$(git -C upstream log -1 --pretty=%ct "${{ env.TAG }}")
          echo "SOURCE_DATE_EPOCH=${SDE}" >> "$GITHUB_ENV"
          echo "Tag ${{ env.TAG }} → commit timestamp ${SDE} ($(date -u -d @${SDE} +%Y-%m-%dT%H:%M:%SZ))"

      - name: Stage source tree inside rootfs
        run: |
          set -euxo pipefail
          sudo mkdir -p rootfs/src
          sudo cp -a upstream/SBFspot             rootfs/src/
          sudo cp -a upstream/SBFspotUploadCommon rootfs/src/
          if [ "${{ matrix.cell.has_daemon }}" = "true" ]; then
            sudo cp -a upstream/SBFspotUploadDaemon rootfs/src/
          fi

      - name: Install hardened compiler wrapper
        run: |
          set -euxo pipefail
          PREFIX='${{ matrix.cell.prefix }}'
          # Phase 5e.1 hardening: modern Debian-equivalent compile flags.
          # - _FORTIFY_SOURCE=2: glibc fortified wrappers (runtime bounds checks)
          # - stack-protector-strong: stack canaries
          # - _GLIBCXX_ASSERTIONS: libstdc++ runtime checks
          # - fPIE: position-independent executable (enables ASLR)
          # Prefix-map retained to normalise __FILE__ strings.
          sudo tee rootfs/usr/local/bin/g++ > /dev/null <<WRAP
          #!/bin/sh
          exec /usr/bin/g++ \
            '-fmacro-prefix-map=/usr/include=${PREFIX}' \
            -D_FORTIFY_SOURCE=2 \
            -fstack-protector-strong \
            -D_GLIBCXX_ASSERTIONS \
            -fPIE \
            "\$@"
          WRAP
          sudo chmod +x rootfs/usr/local/bin/g++

      - name: Install build deps in chroot
        run: |
          set -euxo pipefail
          DB_PKGS='${{ matrix.cell.db_pkgs }}'
          CURL_PKG='${{ matrix.cell.curl_pkg }}'
          sudo chroot rootfs /bin/sh -euxc "
            export DEBIAN_FRONTEND=noninteractive
            apt-get update
            apt-get install -y --no-install-recommends \
              g++ make libbluetooth-dev \
              libboost-date-time-dev libboost-system-dev \
              binutils file \
              ${DB_PKGS} ${CURL_PKG}
            g++ --version | head -1
          "

      - name: Build PIC libbluetooth.a from distro bluez source
        run: |
          set -euxo pipefail
          TRIPLET='${{ matrix.cell.triplet }}'
          # Debian/Raspbian ship libbluetooth.a in libbluetooth-dev but
          # compile it without -fPIC. Static-linking that into a PIE
          # binary emits DT_TEXTREL on armhf. Rebuild the same 3 source
          # files Debian's libbluetooth.la uses (Makefile.am:
          # lib_libbluetooth_la_SOURCES = $lib_headers $lib_sources,
          # where lib_sources = lib/bluetooth.c lib/hci.c lib/sdp.c),
          # compiled with -fPIC, and install over the stock .a.
          sudo chroot rootfs /bin/sh -euxc "
            # Enable deb-src so apt-get source works
            sed -n 's/^deb /deb-src /p' /etc/apt/sources.list >> /etc/apt/sources.list
            apt-get update -qq
            apt-get install -y --no-install-recommends dpkg-dev
            mkdir -p /tmp/bluez && cd /tmp/bluez
            apt-get source bluez
            cd bluez-*/lib
            gcc -fPIC -O2 -Wall -I. -c bluetooth.c hci.c sdp.c
            ar rcs libbluetooth.a bluetooth.o hci.o sdp.o
            install -m 0644 libbluetooth.a /usr/lib/$TRIPLET/libbluetooth.a
            echo '=== verify PIC (should show GOT/GOTOFF relocs) ==='
            readelf -r /usr/lib/$TRIPLET/libbluetooth.a 2>/dev/null \
              | grep -E 'R_ARM_GOT|R_AARCH64_.*GOT|R_ARM_GOTOFF' \
              | head -3 || echo 'no GOT relocs found — check -fPIC applied'
          "

      - name: Build SBFspot (+ daemon if applicable)
        run: |
          set -euxo pipefail
          # Phase 5e.1 link hardening:
          # -pie: produce PIE executable (pairs with -fPIE at compile)
          # -Wl,-z,relro -Wl,-z,now: RELRO + immediate binding
          # -Wl,-z,noexecstack: non-executable stack
          # -Wl,--build-id=sha1: deterministic build-id from content
          HARDEN='-pie -Wl,-z,relro -Wl,-z,now -Wl,-z,noexecstack -Wl,--build-id=sha1'
          COMMON="${{ matrix.cell.common_ldflags }} $HARDEN"
          SBFSPOT_LDFLAGS="${COMMON} ${{ matrix.cell.sbfspot_extra }}"
          DAEMON_LDFLAGS="${COMMON} ${{ matrix.cell.daemon_extra }}"
          MAKE_TARGET='${{ matrix.cell.make_target }}'
          HAS_DAEMON='${{ matrix.cell.has_daemon }}'
          sudo chroot rootfs /bin/sh -euxc "
            cd /src/SBFspot
            make $MAKE_TARGET LDFLAGS='$SBFSPOT_LDFLAGS'
            file $MAKE_TARGET/bin/SBFspot
            readelf -d $MAKE_TARGET/bin/SBFspot | grep NEEDED || true
            if [ \"$HAS_DAEMON\" = \"true\" ]; then
              cd /src/SBFspotUploadDaemon
              make $MAKE_TARGET LDFLAGS='$DAEMON_LDFLAGS'
              file $MAKE_TARGET/bin/SBFspotUploadDaemon
              readelf -d $MAKE_TARGET/bin/SBFspotUploadDaemon | grep NEEDED || true
            fi
          "

      - name: Smoke test — binary runs and reports version
        run: |
          set -uxo pipefail
          MAKE_TARGET='${{ matrix.cell.make_target }}'
          HAS_DAEMON='${{ matrix.cell.has_daemon }}'
          # Run SBFspot --version inside the chroot. armhf runs natively on
          # ubuntu-24.04-arm (aarch64 hw, AArch32 personality); arm64 is
          # straight native.
          echo "=== smoke: SBFspot --version ==="
          sudo chroot rootfs /bin/sh -c "cd /src/SBFspot && ./$MAKE_TARGET/bin/SBFspot --version 2>&1 || ./$MAKE_TARGET/bin/SBFspot 2>&1 | head -5" | head -10 || true
          if [ "$HAS_DAEMON" = "true" ]; then
            echo "=== smoke: SBFspotUploadDaemon --version ==="
            sudo chroot rootfs /bin/sh -c "cd /src/SBFspotUploadDaemon && ./$MAKE_TARGET/bin/SBFspotUploadDaemon --version 2>&1 || ./$MAKE_TARGET/bin/SBFspotUploadDaemon 2>&1 | head -5" | head -10 || true
          fi
          # Verify PIE + RELRO + NX stack via readelf flags
          echo "=== hardening verification ==="
          BIN="rootfs/src/SBFspot/$MAKE_TARGET/bin/SBFspot"
          echo "File type: $(file $BIN | awk -F: '{print $2}')"
          readelf -l $BIN 2>/dev/null | grep -E 'GNU_RELRO|GNU_STACK|PIE|INTERP' | head -5
          readelf -d $BIN 2>/dev/null | grep -E 'BIND_NOW|FLAGS_1' | head

      - name: Download upstream asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euxo pipefail
          url=$(curl -sSL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${UPSTREAM}/releases/tags/${TAG}" \
            | jq -r --arg n "${{ matrix.cell.asset_name }}" \
                '.assets[] | select(.name==$n) | .browser_download_url')
          curl -sSL -o upstream.tar.gz "$url"
          echo "${{ matrix.cell.asset_sha }}  upstream.tar.gz" | sha256sum -c -
          mkdir -p out/upstream
          tar -xzf upstream.tar.gz -C out/upstream

      - name: Normalised-ELF compare + report
        run: |
          set -uxo pipefail
          mkdir -p out/ours
          MAKE_TARGET='${{ matrix.cell.make_target }}'
          HAS_DAEMON='${{ matrix.cell.has_daemon }}'
          sudo cp "rootfs/src/SBFspot/$MAKE_TARGET/bin/SBFspot" out/ours/SBFspot
          if [ "$HAS_DAEMON" = "true" ]; then
            sudo cp "rootfs/src/SBFspotUploadDaemon/$MAKE_TARGET/bin/SBFspotUploadDaemon" \
                    out/ours/SBFspotUploadDaemon
          fi
          sudo chown -R $USER:$USER out/ours
          BINS="SBFspot"
          [ "$HAS_DAEMON" = "true" ] && BINS="$BINS SBFspotUploadDaemon"
          all_match=true
          for bin in $BINS; do
            for side in upstream ours; do
              cp "out/${side}/${bin}" "out/${side}/${bin}.norm"
              strip --strip-all "out/${side}/${bin}.norm" || true
              objcopy --remove-section=.comment --remove-section=.note.gnu.build-id \
                "out/${side}/${bin}.norm" 2>/dev/null || true
            done
            s_u=$(stat -c%s "out/upstream/${bin}.norm")
            s_o=$(stat -c%s "out/ours/${bin}.norm")
            sha_u=$(sha256sum "out/upstream/${bin}.norm" | awk '{print $1}')
            sha_o=$(sha256sum "out/ours/${bin}.norm" | awk '{print $1}')
            if [ "$sha_u" = "$sha_o" ]; then
              echo "::notice title=${{ matrix.cell.id }}::${bin} MATCH size=${s_u}"
              printf '%-25s MATCH  size=%s\n' "$bin" "$s_u"
            else
              all_match=false
              delta=$((s_o - s_u))
              echo "::warning title=${{ matrix.cell.id }}::${bin} residual=${delta} B"
              printf '%-25s DIFF  upstream=%s ours=%s delta=%+d\n' \
                "$bin" "$s_u" "$s_o" "$delta"
            fi
          done
          # Summary file for aggregate report
          mkdir -p out
          {
            echo "cell=${{ matrix.cell.id }}"
            for bin in $BINS; do
              sha_u=$(sha256sum "out/upstream/${bin}.norm" | awk '{print $1}')
              sha_o=$(sha256sum "out/ours/${bin}.norm" | awk '{print $1}')
              s_u=$(stat -c%s "out/upstream/${bin}.norm")
              s_o=$(stat -c%s "out/ours/${bin}.norm")
              if [ "$sha_u" = "$sha_o" ]; then
                echo "$bin=MATCH"
              else
                echo "$bin=DIFF delta=$((s_o - s_u)) upstream_size=$s_u ours_size=$s_o"
              fi
            done
          } > out/summary.txt
          cat out/summary.txt

      - name: Assemble reproducible release tarball
        # Builds sbfspot-<db>-<arch>-linux-<codename>.tar.gz from our
        # freshly-built binaries + the source-tree data files. See
        # phase5e-probe.md §3 (step 13) for the full member list and
        # .md §10 for reproducibility guarantees. All mtimes stamped
        # from SOURCE_DATE_EPOCH; deterministic tar (ustar, sorted,
        # uid/gid 0) + deterministic gzip (`gzip -n` = no timestamp).
        # Rebuilding V3.9.12 in six months from this workflow
        # produces a byte-identical tarball.
        run: |
          set -euxo pipefail
          DB='${{ matrix.cell.db }}'
          ARCH='${{ matrix.cell.debarch }}'
          [ "$ARCH" = "armhf" ] && ARCH=arm
          CODENAME='${{ matrix.cell.codename }}'
          HAS_DAEMON='${{ matrix.cell.has_daemon }}'
          OUTNAME="sbfspot-${DB}-${ARCH}-linux-${CODENAME}.tar.gz"
          STAGE="$(mktemp -d)/sbfspot"
          mkdir -p "$STAGE"
          # Non-binary data files (byte-identical across all 15 tarballs,
          # per Phase 1 fingerprint). Copy from the tagged source tree.
          cp upstream/SBFspot/date_time_zonespec.csv "$STAGE/"
          cp upstream/SBFspot/TagList*.txt           "$STAGE/"
          cp upstream/SBFspot/SBFspot.cfg            "$STAGE/SBFspot.default.cfg"
          # Variant-specific SQL schemas + daemon config
          if [ "$DB" = "sqlite" ]; then
            cp upstream/SBFspot/CreateSQLiteDB.sql   "$STAGE/"
          fi
          if [ "$DB" = "mariadb" ]; then
            cp upstream/SBFspot/CreateMySQLDB.sql    "$STAGE/"
            cp upstream/SBFspot/CreateMySQLUser.sql  "$STAGE/"
          fi
          if [ "$HAS_DAEMON" = "true" ]; then
            cp upstream/SBFspotUploadDaemon/SBFspotUpload.cfg "$STAGE/SBFspotUpload.default.cfg"
          fi
          # Our freshly-built binaries
          cp out/ours/SBFspot "$STAGE/"
          if [ "$HAS_DAEMON" = "true" ]; then
            cp out/ours/SBFspotUploadDaemon "$STAGE/"
          fi
          # Sensible modes: 0755 for executables, 0644 for data.
          # Upstream uses 0777 everywhere; we choose modern convention.
          chmod 0755 "$STAGE/SBFspot"
          [ -f "$STAGE/SBFspotUploadDaemon" ] && chmod 0755 "$STAGE/SBFspotUploadDaemon"
          find "$STAGE" -type f ! -name SBFspot ! -name SBFspotUploadDaemon \
            -exec chmod 0644 {} +
          echo "=== staged for ${OUTNAME} ==="
          ls -la "$STAGE/"
          # Reproducible tar: members at archive root (upstream layout),
          # sorted lexicographically, zero uid/gid, every mtime stamped
          # from SOURCE_DATE_EPOCH, ustar format. Gzip without embedding
          # its own timestamp (gzip -n).
          mkdir -p out/tarballs
          ( cd "$STAGE" && tar \
              --sort=name \
              --owner=0 --group=0 --numeric-owner \
              --mtime="@${SOURCE_DATE_EPOCH}" \
              --format=ustar \
              -cf - -- * ) \
            | gzip -n > "out/tarballs/${OUTNAME}"
          echo "=== ${OUTNAME} built ==="
          ls -la "out/tarballs/${OUTNAME}"
          sha256sum "out/tarballs/${OUTNAME}"
          tar -tvf "out/tarballs/${OUTNAME}"

      - name: Upload per-cell artefacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: phase5e-${{ matrix.cell.id }}
          path: |
            out/
          retention-days: 90
          if-no-files-found: ignore
