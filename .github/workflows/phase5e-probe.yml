            triplet: aarch64-linux-gnu
            db: sqlite
            make_target: sqlite
            asset_name: sbfspot-sqlite-arm64-linux-bullseye.tar.gz
            asset_sha: 3850a4e0d623f07d1f72b0fef9adb56a44421e0baf9fce2c174062eb6d5da4b9
