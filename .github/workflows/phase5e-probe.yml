            triplet: arm-linux-gnueabihf
            db: nosql
            make_target: nosql
            asset_name: sbfspot-nosql-arm-linux-buster.tar.gz
            asset_sha: 5ddc5afbe0d6a9f8f0bfb69eab58c7093c3db18f8f08ef7d7861f5c771eb9ac3
            prefix: 'd:\rpi\cross\buster\gcc8.3.0\arm-linux-gnueabihf\sysroot\usr\include'
