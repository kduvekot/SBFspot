            asset_sha: a6884cf0578cd1f7ffe1fc8191e9dc711cb92584cba853791b8864739674f492
            prefix: 'd:\rpi\cross\bullseye64\gcc10.2.1\aarch64-linux-gnu\sysroot\usr\include'
