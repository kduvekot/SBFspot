            codename: buster
            debarch: armhf
            triplet: arm-linux-gnueabihf
            db: sqlite
            make_target: sqlite
            asset_name: sbfspot-sqlite-arm-linux-buster.tar.gz
            asset_sha: 0d4b32bb02df5cf78b7f78d974a92c4a472dd672bd96f6d396215ea72daf1e0c
            prefix: 'd:\rpi\cross\buster\gcc8.3.0\arm-linux-gnueabihf\sysroot\usr\include'
            mirror: raspbian-legacy
            db_pkgs: 'libsqlite3-dev'
            curl_pkg: 'libcurl4-gnutls-dev'
            has_daemon: true
            common_ldflags: '-s -Wl,--as-needed'
            sbfspot_extra: '-Wl,-Bstatic -lbluetooth -Wl,-Bdynamic'
            daemon_extra: ''
          - id: nosql-arm-buster
            codename: buster
