name: Phase 5e.1 hardened pipeline (modern best practices)

# Modern hardened rebuild of all 15 upstream V3.9.12 tarballs.
#
# Full rationale for every compile flag, link flag, and per-cell
# matrix value is in the companion doc:
#
#     .github/workflows/phase5e-probe.md
#
# …including what we tried and dropped (dynamic libbluetooth,
# SysGCC, non-PIE armhf) and a glossary for concepts like PIC,
# TEXTREL, RELRO, BIND_NOW.
#
# Frozen behind .phase5e-probe-trigger: this workflow only runs on
# push when that trigger file changes. `workflow_dispatch:` also
# enabled for on-demand UI runs.

on:
  workflow_dispatch:
  push:
    branches:
      - claude/add-ci-release-pipeline-QKIcZ
    paths:
      - .github/workflows/.phase5e-probe-trigger

jobs:
  probe:
    name: "${{ matrix.cell.id }}"
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        cell:
          # ========= arm × buster (all DBs) =========
