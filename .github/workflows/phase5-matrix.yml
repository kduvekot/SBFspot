            triplet: arm-linux-gnueabihf
            db: mariadb
            make_target: mariadb
            asset_name: sbfspot-mariadb-arm-linux-bullseye.tar.gz
            asset_sha: c904f3596f78ab424e4cb94a3641262cbdd1167dddebfccfd9582c192de63f0d
            prefix: 'd:\rpi\cross\bullseye\gcc10.2.1\arm-linux-gnueabihf\sysroot\usr\include'
            mirror: raspbian
            db_pkgs: 'libmariadb-dev libmariadb-dev-compat'
            curl_pkg: 'libcurl4-openssl-dev'
            has_daemon: true
            common_ldflags: '-s'
            sbfspot_extra: '-lpthread -Wl,-Bstatic -lbluetooth -lmariadbclient -Wl,-Bdynamic -ldl -lz -lssl -lcrypto'
            daemon_extra: '-lpthread -Wl,-Bstatic -lmariadbclient -Wl,-Bdynamic -ldl -lz -lssl -lcrypto'

          # ========= arm × bookworm (all DBs) — residual expected (~16 KB libstdc++) =========
          - id: sqlite-arm-bookworm
            codename: bookworm
            debarch: armhf
            triplet: arm-linux-gnueabihf
            db: sqlite
            make_target: sqlite
            asset_name: sbfspot-sqlite-arm-linux-bookworm.tar.gz
            asset_sha: 887a393a64dc6d0924c9afa92047002b95a42395c1a2a20ecc09ca71acacabb0
            prefix: 'd:\rpi\cross\bookworm\gcc12.2.0\arm-linux-gnueabihf\sysroot\usr\include'
            mirror: raspbian
            db_pkgs: 'libsqlite3-dev'
            curl_pkg: 'libcurl4-openssl-dev'
            has_daemon: true
            common_ldflags: '-s -static-libstdc++ -Wl,--build-id=none'
            sbfspot_extra: '-Wl,-Bstatic -lbluetooth -Wl,-Bdynamic'
            daemon_extra: ''
          - id: nosql-arm-bookworm
            codename: bookworm
            debarch: armhf
            triplet: arm-linux-gnueabihf
            db: nosql
            make_target: nosql
            asset_name: sbfspot-nosql-arm-linux-bookworm.tar.gz
            asset_sha: 1d5ee0f306072c87ed410585b3170979b8691f604341f01413af5efca3791a20
            prefix: 'd:\rpi\cross\bookworm\gcc12.2.0\arm-linux-gnueabihf\sysroot\usr\include'
            mirror: raspbian
            db_pkgs: ''
            curl_pkg: ''
            has_daemon: false
            common_ldflags: '-s -static-libstdc++ -Wl,--build-id=none'
            sbfspot_extra: '-Wl,-Bstatic -lbluetooth -Wl,-Bdynamic'
            daemon_extra: ''
          - id: mariadb-arm-bookworm
            codename: bookworm
            debarch: armhf
            triplet: arm-linux-gnueabihf
            db: mariadb
            make_target: mariadb
            asset_name: sbfspot-mariadb-arm-linux-bookworm.tar.gz
            asset_sha: 158ff3e6c566ff4e367aced2b1e2a9ca09b06b3c6baf77325ea93f1b735f5856
            prefix: 'd:\rpi\cross\bookworm\gcc12.2.0\arm-linux-gnueabihf\sysroot\usr\include'
            mirror: raspbian
            db_pkgs: 'libmariadb-dev libmariadb-dev-compat'
            curl_pkg: 'libcurl4-openssl-dev'
            has_daemon: true
            common_ldflags: '-s -static-libstdc++ -Wl,--build-id=none'
            sbfspot_extra: '-lpthread -Wl,-Bstatic -lbluetooth -lmariadbclient -Wl,-Bdynamic -ldl -lz -lssl -lcrypto'
            daemon_extra: '-lpthread -Wl,-Bstatic -lmariadbclient -Wl,-Bdynamic -ldl -lz -lssl -lcrypto'

          # ========= arm64 × bullseye (all DBs) =========
          - id: sqlite-arm64-bullseye
            codename: bullseye
            debarch: arm64
            triplet: aarch64-linux-gnu
            db: sqlite
            make_target: sqlite
            asset_name: sbfspot-sqlite-arm64-linux-bullseye.tar.gz
            asset_sha: 3850a4e0d623f07d1f72b0fef9adb56a44421e0baf9fce2c174062eb6d5da4b9
            prefix: 'd:\rpi\cross\bullseye64\gcc10.2.1\aarch64-linux-gnu\sysroot\usr\include'
            mirror: debian
            db_pkgs: 'libsqlite3-dev'
            curl_pkg: 'libcurl4-openssl-dev'
            has_daemon: true
            common_ldflags: '-s'
            sbfspot_extra: '-Wl,-Bstatic -lbluetooth -Wl,-Bdynamic'
            daemon_extra: ''
          - id: nosql-arm64-bullseye
            codename: bullseye
            debarch: arm64
            triplet: aarch64-linux-gnu
            db: nosql
            make_target: nosql
            asset_name: sbfspot-nosql-arm64-linux-bullseye.tar.gz
            asset_sha: a6884cf0578cd1f7ffe1fc8191e9dc711cb92584cba853791b8864739674f492
            prefix: 'd:\rpi\cross\bullseye64\gcc10.2.1\aarch64-linux-gnu\sysroot\usr\include'
            mirror: debian
            db_pkgs: ''
            curl_pkg: ''
            has_daemon: false
            common_ldflags: '-s'
            sbfspot_extra: '-Wl,-Bstatic -lbluetooth -Wl,-Bdynamic'
            daemon_extra: ''
          - id: mariadb-arm64-bullseye
            codename: bullseye
            debarch: arm64
            triplet: aarch64-linux-gnu
            db: mariadb
            make_target: mariadb
            asset_name: sbfspot-mariadb-arm64-linux-bullseye.tar.gz
            asset_sha: 921e6d09ed93aafe93d937897cee752fcef7a8bd7ce33fe8d73599efce0243c4
            prefix: 'd:\rpi\cross\bullseye64\gcc10.2.1\aarch64-linux-gnu\sysroot\usr\include'
            mirror: debian
            db_pkgs: 'libmariadb-dev libmariadb-dev-compat'
            curl_pkg: 'libcurl4-openssl-dev'
            has_daemon: true
            common_ldflags: '-s'
            sbfspot_extra: '-lpthread -Wl,-Bstatic -lbluetooth -lmariadbclient -Wl,-Bdynamic -ldl -lz -lssl -lcrypto'
            daemon_extra: '-lpthread -Wl,-Bstatic -lmariadbclient -Wl,-Bdynamic -ldl -lz -lssl -lcrypto'

          # ========= arm64 × bookworm (all DBs) — dual-.comment residual expected =========
          - id: sqlite-arm64-bookworm
            codename: bookworm
            debarch: arm64
            triplet: aarch64-linux-gnu
            db: sqlite
            make_target: sqlite
            asset_name: sbfspot-sqlite-arm64-linux-bookworm.tar.gz
            asset_sha: f35fb21f8298149b2af36d01583b820f5686a2d817c8dd973c286dc5aabff483
            prefix: 'd:\rpi\cross\bookworm64\gcc12.2.0\aarch64-linux-gnu\sysroot\usr\include'
            mirror: debian
            db_pkgs: 'libsqlite3-dev'
            curl_pkg: 'libcurl4-openssl-dev'
            has_daemon: true
            common_ldflags: '-s'
            sbfspot_extra: '-Wl,-Bstatic -lbluetooth -Wl,-Bdynamic'
            daemon_extra: ''
          - id: nosql-arm64-bookworm
            codename: bookworm
            debarch: arm64
            triplet: aarch64-linux-gnu
            db: nosql
            make_target: nosql
            asset_name: sbfspot-nosql-arm64-linux-bookworm.tar.gz
            asset_sha: ee70b62ffba8a727539f3fbedbecd2a297aeea30e5c44068266342b39d17019a
            prefix: 'd:\rpi\cross\bookworm64\gcc12.2.0\aarch64-linux-gnu\sysroot\usr\include'
            mirror: debian
            db_pkgs: ''
            curl_pkg: ''
            has_daemon: false
            common_ldflags: '-s'
            sbfspot_extra: '-Wl,-Bstatic -lbluetooth -Wl,-Bdynamic'
            daemon_extra: ''
          - id: mariadb-arm64-bookworm
            codename: bookworm
            debarch: arm64
            triplet: aarch64-linux-gnu
            db: mariadb
            make_target: mariadb
            asset_name: sbfspot-mariadb-arm64-linux-bookworm.tar.gz
            asset_sha: b44cab3a25e661053c60350029fa9211c34d540994bbbbd2d33285e6bea994bd
            prefix: 'd:\rpi\cross\bookworm64\gcc12.2.0\aarch64-linux-gnu\sysroot\usr\include'
            mirror: debian
            db_pkgs: 'libmariadb-dev libmariadb-dev-compat'
            curl_pkg: 'libcurl4-openssl-dev'
            has_daemon: true
            common_ldflags: '-s'
            sbfspot_extra: '-lpthread -Wl,-Bstatic -lbluetooth -lmariadbclient -Wl,-Bdynamic -ldl -lz -lssl -lcrypto'
            daemon_extra: '-lpthread -Wl,-Bstatic -lmariadbclient -Wl,-Bdynamic -ldl -lz -lssl -lcrypto'

    env:
      TAG: V3.9.12
      UPSTREAM: SBFspot/SBFspot

    steps:
      - name: Install host-side tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            debootstrap xxd binutils file curl jq debian-archive-keyring

      - name: Fetch Raspbian keyring (if applicable)
        if: matrix.cell.mirror == 'raspbian' || matrix.cell.mirror == 'raspbian-legacy'
        run: |
          set -euxo pipefail
          mkdir -p keyring
          curl -sSL https://archive.raspbian.org/raspbian.public.key \
            -o keyring/raspbian.asc
          gpg --dearmor < keyring/raspbian.asc > keyring/raspbian.gpg

      - name: Debootstrap rootfs
        run: |
          set -euxo pipefail
          case "${{ matrix.cell.mirror }}" in
            raspbian)
              MIRROR="http://archive.raspbian.org/raspbian"
              KEYRING="$PWD/keyring/raspbian.gpg"
              ;;
            raspbian-legacy)
              MIRROR="http://legacy.raspbian.org/raspbian"
              KEYRING="$PWD/keyring/raspbian.gpg"
              ;;
            debian)
              MIRROR="http://snapshot.debian.org/archive/debian/20250222T000000Z"
              KEYRING="/usr/share/keyrings/debian-archive-keyring.gpg"
              ;;
          esac
          sudo debootstrap \
            --arch=${{ matrix.cell.debarch }} \
            --variant=minbase \
            --keyring="$KEYRING" \
            --include=ca-certificates \
            "${{ matrix.cell.codename }}" \
            rootfs "$MIRROR"

      - name: Check out upstream V3.9.12
        uses: actions/checkout@v4
        with:
          repository: ${{ env.UPSTREAM }}
          ref: ${{ env.TAG }}
          path: upstream

      - name: Stage source tree inside rootfs
        run: |
          set -euxo pipefail
          sudo mkdir -p rootfs/src
          sudo cp -a upstream/SBFspot             rootfs/src/
          sudo cp -a upstream/SBFspotUploadCommon rootfs/src/
          if [ "${{ matrix.cell.has_daemon }}" = "true" ]; then
            sudo cp -a upstream/SBFspotUploadDaemon rootfs/src/
          fi

      - name: Install prefix-map wrapper
        run: |
          set -euxo pipefail
          PREFIX='${{ matrix.cell.prefix }}'
          sudo tee rootfs/usr/local/bin/g++ > /dev/null <<WRAP
          #!/bin/sh
          exec /usr/bin/g++ '-fmacro-prefix-map=/usr/include=${PREFIX}' "\$@"
          WRAP
          sudo chmod +x rootfs/usr/local/bin/g++

      - name: Install build deps in chroot
        run: |
          set -euxo pipefail
          DB_PKGS='${{ matrix.cell.db_pkgs }}'
          CURL_PKG='${{ matrix.cell.curl_pkg }}'
          sudo chroot rootfs /bin/sh -euxc "
            export DEBIAN_FRONTEND=noninteractive
            apt-get update
            apt-get install -y --no-install-recommends \
              g++ make libbluetooth-dev \
              libboost-date-time-dev libboost-system-dev \
              binutils file \
              ${DB_PKGS} ${CURL_PKG}
            g++ --version | head -1
          "

      - name: Build SBFspot (+ daemon if applicable)
        run: |
          set -euxo pipefail
          COMMON='${{ matrix.cell.common_ldflags }}'
          SBFSPOT_LDFLAGS="${COMMON} ${{ matrix.cell.sbfspot_extra }}"
          DAEMON_LDFLAGS="${COMMON} ${{ matrix.cell.daemon_extra }}"
          MAKE_TARGET='${{ matrix.cell.make_target }}'
          HAS_DAEMON='${{ matrix.cell.has_daemon }}'
          sudo chroot rootfs /bin/sh -euxc "
            cd /src/SBFspot
            make $MAKE_TARGET LDFLAGS='$SBFSPOT_LDFLAGS'
            readelf -d $MAKE_TARGET/bin/SBFspot | grep NEEDED || true
            if [ \"$HAS_DAEMON\" = \"true\" ]; then
              cd /src/SBFspotUploadDaemon
              make $MAKE_TARGET LDFLAGS='$DAEMON_LDFLAGS'
              readelf -d $MAKE_TARGET/bin/SBFspotUploadDaemon | grep NEEDED || true
            fi
          "

      - name: Download upstream asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euxo pipefail
          url=$(curl -sSL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${UPSTREAM}/releases/tags/${TAG}" \
            | jq -r --arg n "${{ matrix.cell.asset_name }}" \
                '.assets[] | select(.name==$n) | .browser_download_url')
          curl -sSL -o upstream.tar.gz "$url"
          echo "${{ matrix.cell.asset_sha }}  upstream.tar.gz" | sha256sum -c -
          mkdir -p out/upstream
          tar -xzf upstream.tar.gz -C out/upstream

      - name: Normalised-ELF compare + report
        run: |
          set -uxo pipefail
          mkdir -p out/ours
          MAKE_TARGET='${{ matrix.cell.make_target }}'
          HAS_DAEMON='${{ matrix.cell.has_daemon }}'
          sudo cp "rootfs/src/SBFspot/$MAKE_TARGET/bin/SBFspot" out/ours/SBFspot
          if [ "$HAS_DAEMON" = "true" ]; then
            sudo cp "rootfs/src/SBFspotUploadDaemon/$MAKE_TARGET/bin/SBFspotUploadDaemon" \
                    out/ours/SBFspotUploadDaemon
          fi
          sudo chown -R $USER:$USER out/ours
          BINS="SBFspot"
          [ "$HAS_DAEMON" = "true" ] && BINS="$BINS SBFspotUploadDaemon"
          all_match=true
          for bin in $BINS; do
            for side in upstream ours; do
              cp "out/${side}/${bin}" "out/${side}/${bin}.norm"
              strip --strip-all "out/${side}/${bin}.norm" || true
              objcopy --remove-section=.comment --remove-section=.note.gnu.build-id \
                "out/${side}/${bin}.norm" 2>/dev/null || true
            done
            s_u=$(stat -c%s "out/upstream/${bin}.norm")
            s_o=$(stat -c%s "out/ours/${bin}.norm")
            sha_u=$(sha256sum "out/upstream/${bin}.norm" | awk '{print $1}')
            sha_o=$(sha256sum "out/ours/${bin}.norm" | awk '{print $1}')
            if [ "$sha_u" = "$sha_o" ]; then
              echo "::notice title=${{ matrix.cell.id }}::${bin} MATCH size=${s_u}"
              printf '%-25s MATCH  size=%s\n' "$bin" "$s_u"
            else
              all_match=false
              delta=$((s_o - s_u))
              echo "::warning title=${{ matrix.cell.id }}::${bin} residual=${delta} B"
              printf '%-25s DIFF  upstream=%s ours=%s delta=%+d\n' \
                "$bin" "$s_u" "$s_o" "$delta"
            fi
          done
          # Summary file for aggregate report
          mkdir -p out
          {
            echo "cell=${{ matrix.cell.id }}"
            for bin in $BINS; do
              sha_u=$(sha256sum "out/upstream/${bin}.norm" | awk '{print $1}')
              sha_o=$(sha256sum "out/ours/${bin}.norm" | awk '{print $1}')
              s_u=$(stat -c%s "out/upstream/${bin}.norm")
              s_o=$(stat -c%s "out/ours/${bin}.norm")
              if [ "$sha_u" = "$sha_o" ]; then
                echo "$bin=MATCH"
              else
                echo "$bin=DIFF delta=$((s_o - s_u)) upstream_size=$s_u ours_size=$s_o"
              fi
            done
          } > out/summary.txt
          cat out/summary.txt

      - name: Upload per-cell artefacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase5-${{ matrix.cell.id }}
          path: |
            out/
          retention-days: 90
          if-no-files-found: ignore
