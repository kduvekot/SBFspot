name: Phase 5 full 15-combo matrix (residual per variant)

# Runs the current release pipeline shape across all 15 upstream
# V3.9.12 variants, reports residual per combo. Expected outcomes
# (from Phase 3.5 + Phase 4 investigations):
#
#   arm × bullseye  × {sqlite,nosql,mariadb}  → MATCH (Bar 1a'')
#   arm × buster    × {sqlite,nosql,mariadb}  → close-match (maybe small residual)
#   arm64 × bullseye × {sqlite,nosql,mariadb} → MATCH
#   arm × bookworm  × {sqlite,nosql,mariadb}  → ~16 KB residual (static libstdc++)
#   arm64 × bookworm × {sqlite,nosql,mariadb} → ~10 KB residual (dual-.comment)
#
# No tarball-layer compare yet — that needs per-variant member
# lists (Phase 5b). This probe is binary-byte diff per combo.
#
# Frozen behind .phase5-matrix-trigger.

on:
  workflow_dispatch:
  push:
    branches:
      - claude/add-ci-release-pipeline-QKIcZ
    paths:
      - .github/workflows/.phase5-matrix-trigger

jobs:
  probe:
    name: "${{ matrix.cell.id }}"
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        cell:
          # ========= arm × buster (all DBs) =========
          - id: sqlite-arm-buster
            codename: buster
            debarch: armhf
            triplet: arm-linux-gnueabihf
            db: sqlite
            make_target: sqlite
            asset_name: sbfspot-sqlite-arm-linux-buster.tar.gz
            asset_sha: 0d4b32bb02df5cf78b7f78d974a92c4a472dd672bd96f6d396215ea72daf1e0c
            prefix: 'd:\rpi\cross\buster\gcc8.3.0\arm-linux-gnueabihf\sysroot\usr\include'
            mirror: raspbian-legacy
            db_pkgs: 'libsqlite3-dev'
            curl_pkg: 'libcurl4-gnutls-dev'
            has_daemon: true
            common_ldflags: '-s'
            sbfspot_extra: '-Wl,--as-needed -Wl,-Bstatic -lbluetooth -lboost_date_time -lboost_system -Wl,-Bdynamic -Wl,--no-as-needed -lgnutls -ldl -Wl,--as-needed'
            daemon_extra: ''
          - id: nosql-arm-buster
            codename: buster
            debarch: armhf
            triplet: arm-linux-gnueabihf
            db: nosql
            make_target: nosql
            asset_name: sbfspot-nosql-arm-linux-buster.tar.gz
            asset_sha: 5ddc5afbe0d6a9f8f0bfb69eab58c7093c3db18f8f08ef7d7861f5c771eb9ac3
            prefix: 'd:\rpi\cross\buster\gcc8.3.0\arm-linux-gnueabihf\sysroot\usr\include'
            mirror: raspbian-legacy
            db_pkgs: ''
            curl_pkg: ''
            has_daemon: false
            common_ldflags: '-s'
            sbfspot_extra: '-Wl,--as-needed -Wl,-Bstatic -lbluetooth -lboost_date_time -lboost_system -Wl,-Bdynamic'
            daemon_extra: ''
          - id: mariadb-arm-buster
            codename: buster
            debarch: armhf
            triplet: arm-linux-gnueabihf
            db: mariadb
            make_target: mariadb
            asset_name: sbfspot-mariadb-arm-linux-buster.tar.gz
            asset_sha: 9c9e47237101497e921d2da28b06106b110c44a0cb274f4efafd00e1d1fa0224
            prefix: 'd:\rpi\cross\buster\gcc8.3.0\arm-linux-gnueabihf\sysroot\usr\include'
            mirror: raspbian-legacy
            db_pkgs: 'libmariadb-dev libmariadb-dev-compat'
            curl_pkg: 'libcurl4-gnutls-dev'
            has_daemon: true
            common_ldflags: '-s'
            sbfspot_extra: '-lpthread -Wl,--as-needed -Wl,-Bstatic -lbluetooth -lboost_date_time -lboost_system -lmariadbclient -Wl,-Bdynamic -Wl,--no-as-needed -lgnutls -ldl -lz -lssl -lcrypto -Wl,--as-needed'
            daemon_extra: '-lpthread -Wl,-Bstatic -lmariadbclient -Wl,-Bdynamic -ldl -lz -lssl -lcrypto'

          # ========= arm × bullseye (all DBs) =========
          - id: sqlite-arm-bullseye
            codename: bullseye
            debarch: armhf
            triplet: arm-linux-gnueabihf
            db: sqlite
            make_target: sqlite
            asset_name: sbfspot-sqlite-arm-linux-bullseye.tar.gz
            asset_sha: 20a532f1a942a801b7bb982ba0dc89fac2981a566402ac3e9215e56e6625e1b8
            prefix: 'd:\rpi\cross\bullseye\gcc10.2.1\arm-linux-gnueabihf\sysroot\usr\include'
