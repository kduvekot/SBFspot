            prefix: 'd:\rpi\cross\bullseye\gcc10.2.1\arm-linux-gnueabihf\sysroot\usr\include'
            mirror: raspbian
            db_pkgs: ''
            curl_pkg: ''
            has_daemon: false
            common_ldflags: '-s'
            sbfspot_extra: '-Wl,-Bstatic -lbluetooth -Wl,-Bdynamic'
