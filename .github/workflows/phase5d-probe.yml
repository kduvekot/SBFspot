name: Phase 5d SysGCC libstdc++.a substitution probe

# Two-job pipeline:
#  extract: ubuntu-latest (x86_64) — runs the SysGCC installer
#           silently under Wine, pulls out libstdc++.a
#  build:   ubuntu-24.04-arm — uses that libstdc++.a in our
#           bookworm-armhf build, diffs vs upstream V3.9.12.
#
# Frozen behind .phase5d-probe-trigger.

on:
  workflow_dispatch:
  push:
    branches:
      - claude/add-ci-release-pipeline-QKIcZ
    paths:
      - .github/workflows/.phase5d-probe-trigger

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SYSGCC_URL: https://sysprogs.com/getfile/2275/raspberry-gcc12.2.0-r2.exe
    steps:
      - name: Install Wine
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends wine wine32:i386 xvfb cabextract

      - name: Download SysGCC installer
        run: |
          set -euxo pipefail
          curl -sSL --fail -o sysgcc.exe "${SYSGCC_URL}"
          ls -lh sysgcc.exe
          file sysgcc.exe
          sha256sum sysgcc.exe

      - name: Silent-install SysGCC under Wine
        run: |
          set -uxo pipefail
          export WINEPREFIX=$HOME/.wine-sysgcc
          export WINEDEBUG=-all
          # Pre-create prefix (non-interactive)
          wineboot --init || true
          sleep 2
          # Sysprogs installers support /S silent flag (NSIS convention) or /SILENT;
          # try both. Also try /D= to redirect install dir.
          mkdir -p ~/sysgcc-install
          WIN_INSTALL_DIR=$(winepath -w ~/sysgcc-install 2>/dev/null || echo "C:\\SysGCC\\raspberry")
          echo "Install dir: $WIN_INSTALL_DIR"
          xvfb-run -a wine sysgcc.exe /S "/D=${WIN_INSTALL_DIR}" &
          WINE_PID=$!
          # Wait up to 15 min for installer to finish. Poll for the target file.
          for i in $(seq 1 180); do
            if find ~/sysgcc-install $WINEPREFIX/drive_c -name 'libstdc++.a' 2>/dev/null | grep -q .; then
              echo "libstdc++.a appeared at iteration $i"
              break
            fi
            sleep 5
          done
          # Give installer a bit more time then kill if still running
          sleep 10
          kill $WINE_PID 2>/dev/null || true
          wineserver -k 2>/dev/null || true

      - name: Locate + collect libstdc++.a
        run: |
          set -uxo pipefail
          export WINEPREFIX=$HOME/.wine-sysgcc
          echo "--- search all paths ---"
          find ~/sysgcc-install "$WINEPREFIX/drive_c" -name 'libstdc++.a' 2>/dev/null | while read f; do
            s=$(stat -c%s "$f"); sha=$(sha256sum "$f" | awk '{print $1}')
            echo "$f  size=$s sha=$sha"
          done
          LIBA=$(find ~/sysgcc-install "$WINEPREFIX/drive_c" -name 'libstdc++.a' 2>/dev/null | head -1)
          if [ -z "$LIBA" ]; then
            echo "ERROR: libstdc++.a not found"
            echo "--- directory listing for debugging ---"
            ls -la ~/sysgcc-install/ 2>/dev/null || echo "no sysgcc-install"
            ls -la $WINEPREFIX/drive_c/ 2>/dev/null || echo "no drive_c"
            find $WINEPREFIX/drive_c -maxdepth 4 -type d 2>/dev/null | head -20
            exit 1
          fi
          mkdir -p out
          cp "$LIBA" out/sysgcc_libstdcxx.a
          # Also try the bundled cross-g++ for its .comment introspection if possible
          find ~/sysgcc-install "$WINEPREFIX/drive_c" -name 'arm-linux-gnueabihf-g++*' 2>/dev/null | head -3
          echo "OK; uploading libstdc++.a"

      - name: Upload libstdc++.a artefact
        uses: actions/upload-artifact@v4
        with:
          name: sysgcc-libstdcxx
          path: out/sysgcc_libstdcxx.a
          retention-days: 7

  build:
    needs: extract
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    env:
      TAG: V3.9.12
      UPSTREAM: SBFspot/SBFspot
      ASSET_NAME: sbfspot-sqlite-arm-linux-bookworm.tar.gz
      ASSET_SHA256: 887a393a64dc6d0924c9afa92047002b95a42395c1a2a20ecc09ca71acacabb0
      RASPBIAN_MIRROR: http://archive.raspbian.org/raspbian
      RASPBIAN_SUITE: bookworm

    steps:
      - name: Install host-side tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            debootstrap xxd binutils file curl jq

      - name: Download SysGCC libstdc++.a artefact
        uses: actions/download-artifact@v4
        with:
          name: sysgcc-libstdcxx
          path: /tmp/

      - name: Inspect SysGCC libstdc++.a
        run: |
          set -euxo pipefail
          ls -la /tmp/sysgcc_libstdcxx.a
          file /tmp/sysgcc_libstdcxx.a
          sha256sum /tmp/sysgcc_libstdcxx.a
          ar t /tmp/sysgcc_libstdcxx.a 2>/dev/null | wc -l || echo "(not ar format)"

      - name: Fetch Raspbian keyring + debootstrap
        run: |
          set -euxo pipefail
          mkdir -p keyring
          curl -sSL https://archive.raspbian.org/raspbian.public.key -o keyring/raspbian.asc
          gpg --dearmor < keyring/raspbian.asc > keyring/raspbian.gpg
          sudo debootstrap --arch=armhf --variant=minbase \
            --keyring=$PWD/keyring/raspbian.gpg --include=ca-certificates \
            "${RASPBIAN_SUITE}" rootfs "${RASPBIAN_MIRROR}"

      - name: Install build deps + substitute libstdc++.a
        run: |
          set -euxo pipefail
          sudo chroot rootfs /bin/sh -euxc '
            export DEBIAN_FRONTEND=noninteractive
            apt-get update
            apt-get install -y --no-install-recommends \
              g++ make libbluetooth-dev \
              libboost-date-time-dev libboost-system-dev \
              libsqlite3-dev libcurl4-openssl-dev binutils file
          '
          echo "=== pre-substitution ==="
          for f in rootfs/usr/lib/gcc/arm-linux-gnueabihf/12/libstdc++.a \
                   rootfs/usr/lib/arm-linux-gnueabihf/libstdc++.a; do
            [ -f "$f" ] && echo "$f: sha=$(sudo sha256sum "$f" | awk '{print $1}')  size=$(sudo stat -c%s "$f")"
          done
          for f in rootfs/usr/lib/gcc/arm-linux-gnueabihf/12/libstdc++.a \
                   rootfs/usr/lib/arm-linux-gnueabihf/libstdc++.a; do
            if [ -f "$f" ]; then
              sudo cp /tmp/sysgcc_libstdcxx.a "$f"
              echo "AFTER $f: sha=$(sudo sha256sum "$f" | awk '{print $1}')"
            fi
          done

      - name: Check out upstream + stage
        uses: actions/checkout@v4
        with:
          repository: ${{ env.UPSTREAM }}
          ref: ${{ env.TAG }}
          path: upstream

      - name: Stage + wrapper
        run: |
          set -euxo pipefail
          sudo mkdir -p rootfs/src
          sudo cp -a upstream/SBFspot             rootfs/src/
          sudo cp -a upstream/SBFspotUploadDaemon rootfs/src/
          sudo cp -a upstream/SBFspotUploadCommon rootfs/src/
          sudo tee rootfs/usr/local/bin/g++ > /dev/null <<'WRAP'
          #!/bin/sh
          exec /usr/bin/g++ '-fmacro-prefix-map=/usr/include=d:\rpi\cross\bookworm\gcc12.2.0\arm-linux-gnueabihf\sysroot\usr\include' "$@"
          WRAP
          sudo chmod +x rootfs/usr/local/bin/g++

      - name: Build + compare
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uxo pipefail
          COMMON_LDFLAGS='-s -static-libstdc++ -Wl,--build-id=none'
          SBFSPOT_LDFLAGS="${COMMON_LDFLAGS} -Wl,-Bstatic -lbluetooth -Wl,-Bdynamic"
          sudo chroot rootfs /bin/sh -euxc "
            cd /src/SBFspot
            make sqlite LDFLAGS='${SBFSPOT_LDFLAGS}'
            cd /src/SBFspotUploadDaemon
            make sqlite LDFLAGS='${COMMON_LDFLAGS}'
          "
          url=$(curl -sSL -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${UPSTREAM}/releases/tags/${TAG}" \
            | jq -r --arg n "$ASSET_NAME" '.assets[] | select(.name==$n) | .browser_download_url')
          curl -sSL -o upstream.tar.gz "$url"
          echo "${ASSET_SHA256}  upstream.tar.gz" | sha256sum -c -
          mkdir -p out/upstream out/ours
          tar -xzf upstream.tar.gz -C out/upstream
          sudo cp rootfs/src/SBFspot/sqlite/bin/SBFspot out/ours/SBFspot
          sudo cp rootfs/src/SBFspotUploadDaemon/sqlite/bin/SBFspotUploadDaemon out/ours/SBFspotUploadDaemon
          sudo chown -R $USER:$USER out/ours
          for bin in SBFspot SBFspotUploadDaemon; do
            for side in upstream ours; do
              cp "out/${side}/${bin}" "out/${side}/${bin}.norm"
              strip --strip-all "out/${side}/${bin}.norm" || true
              objcopy --remove-section=.comment --remove-section=.note.gnu.build-id \
                "out/${side}/${bin}.norm" 2>/dev/null || true
            done
            s_u=$(stat -c%s "out/upstream/${bin}.norm"); s_o=$(stat -c%s "out/ours/${bin}.norm")
            sha_u=$(sha256sum "out/upstream/${bin}.norm" | awk '{print $1}')
            sha_o=$(sha256sum "out/ours/${bin}.norm" | awk '{print $1}')
            if [ "$sha_u" = "$sha_o" ]; then
              echo "::notice title=SysGCC-r2 ${bin}::MATCH size=${s_u}"
              echo "$bin: MATCH ✓"
            else
              echo "::warning title=SysGCC-r2 ${bin}::residual=$((s_o - s_u)) B"
              echo "$bin: DIFF upstream=$s_u ours=$s_o delta=$((s_o - s_u))"
            fi
          done

      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase5d-sysgcc-r2
          path: |
            out/
          retention-days: 90
          if-no-files-found: ignore
